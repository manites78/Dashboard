<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="build/css/app.css">
    <title>Dashboard</title>
</head>
<body>
    
    <header class="header">
        <button class="boton" type="button" aria-label="Cerrar menú" aria-controls="sidebar" aria-expanded="true">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>   
        <nav class="navegacion">
            <a class="navegacion--link" href="#">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
            </a>
            <a class="navegacion--link" href="#">Cerrar Sesion</a>
        </nav>
    </header>


    <aside class="aside" id="sidebar" aria-label="Menú lateral">
        <nav aria-label="Navegación principal">
            <ul class="navegacion--ul">
                <li>
                    <a href="#console-panel" aria-label="Consola" aria-current="page">
                        <i class="bi bi-terminal" aria-hidden="true"></i>
                        <span>Consola</span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Usuarios">
                        <i class="bi bi-people-fill" aria-hidden="true"></i>
                        <span>Usuarios</span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Archivos">
                        <i class="bi bi-folder-fill" aria-hidden="true"></i>
                        <span>Archivos</span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Software">
                        <i class="bi bi-gear" aria-hidden="true"></i>
                        <span>Software</span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Plugins">
                        <i class="bi bi-plugin" aria-hidden="true"></i>
                        <span>Plugins</span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Mundos">
                        <i class="bi bi-globe-americas" aria-hidden="true"></i>
                        <span>Mundos</span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="La Nube">
                        <i class="bi bi-cloud-download" aria-hidden="true"></i>
                        <span>La Nube</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>
    <button class="aside__fondo" type="button" aria-label="Cerrar menú" hidden></button>

    <div class="main-contenido">
        <div class="nombre">
            <h1>Panel de Control</h1>
            <h2>Hola Juan Pablo</h2>
        </div>

        <div id="console-panel" class="console">
            <div class="console-output">
                <!-- aquí se agregan las líneas de log con JS -->
            </div>
            <input class="console--input" id="console-input" type="text" placeholder="Escribe un comando..." />
        </div>
        <!--<input class="console--input" id="console-input" type="text" placeholder="Escribe un comando..." />-->
    </div>
    <script src="src/js/aside.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
